<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>FloraBOT AI – Visual Plant Care Assistant</title>
  <meta name="description" content="Upload a plant photo. FloraBOT AI looks for visible water stress, gives a cautious watering recommendation and confirms its ESP32 watering alert LED.">
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1712" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232f7d4f'/%3E%3Cpath d='M10.5 29.5C10.5 18 17.5 10.8 30 10.5C29.6 23 22.4 29.5 10.5 29.5Z' fill='%23fff'/%3E%3C/svg%3E">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/chat.css">
  <script type="module" src="/js/chat.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <rect class="brand__tile" width="40" height="40" rx="12"/>
            <path class="brand__leaf" d="M10.5 29.5C10.5 18 17.5 10.8 30 10.5C29.6 23 22.4 29.5 10.5 29.5Z"/>
            <path class="brand__vein" d="M10.5 29.5 16.8 23.2H21.2M16.8 23.2V18.8"/>
            <circle class="brand__pad" cx="22.4" cy="23.2" r="1.7"/>
            <circle class="brand__pad" cx="16.8" cy="17.6" r="1.7"/>
          </svg>
          <div class="brand__text">
            <h1 class="brand__name">FloraBOT AI</h1>
            <p class="brand__tagline"><span>See plant stress.</span> <span>Understand plant care.</span></p>
          </div>
        </div>

        <div class="hw" id="hw" data-state="loading">
          <button type="button" class="hw__button" id="hw-button" popovertarget="hw-panel" aria-expanded="false">
            <span class="led" id="hw-led" data-state="unknown" aria-hidden="true"></span>
            <span class="hw__name">Watering LED</span>
            <span class="visually-hidden" id="hw-led-text">state unknown.</span>
            <span class="hw__status" id="hw-status">Checking…</span>
            <span class="hw__sim" id="hw-sim" hidden>Simulated</span>
            <span class="hw__pending" id="hw-pending" hidden><span class="hw__pending-full">LED request pending</span><span class="hw__pending-short" aria-hidden="true">Pending</span></span>
            <span class="visually-hidden">Show hardware details</span>
            <svg class="icon hw__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg>
          </button>
        </div>

        <button type="button" class="btn btn-ghost tool" id="phone-button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 18.5h3"/></svg>
          <span class="tool__label">Open on phone</span>
        </button>

        <button type="button" class="btn btn-ghost btn-icon tool" id="models-button" aria-label="AI models" title="AI models" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>

        <button type="button" class="btn btn-ghost btn-icon tool" id="theme-button" aria-label="Theme: Auto">
          <svg class="icon theme-icon theme-icon--auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
          <svg class="icon theme-icon theme-icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          <svg class="icon theme-icon theme-icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6z"/></svg>
        </button>
      </div>
    </header>

    <div class="hw-panel" id="hw-panel" popover role="dialog" aria-labelledby="hw-panel-title"></div>

    <main class="chat">
      <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation with FloraBOT" tabindex="0"></div>
    </main>

    <div class="dock">
      <div class="dock__inner">
        <div class="quick" id="quick-replies" role="group" aria-label="Suggested replies" hidden></div>
        <div class="tray" id="tray" hidden></div>
        <p class="visually-hidden" id="tray-status" role="status"></p>
        <form class="composer" id="composer" autocomplete="off" aria-label="Send a message">
          <button type="button" class="composer__tool" id="attach-button" aria-label="Attach a photo">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="9.5" r="1.8"/><path d="m21 15.5-5-5L6 20"/></svg>
          </button>
          <button type="button" class="composer__tool" id="camera-button" aria-label="Take a photo" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.4"/></svg>
          </button>
          <input class="composer__input" id="composer-input" type="text" name="message" aria-label="Message FloraBOT" placeholder="Ask a plant-care question or attach a photo…" enterkeyhint="send" autocomplete="off">
          <button type="submit" class="composer__send" id="send-button" aria-label="Send">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5.5M6 11.5l6-6 6 6"/></svg>
          </button>
        </form>
        <input type="file" id="file-input" accept=".jpg,.jpeg,.png,image/jpeg,image/png" hidden>
        <input type="file" id="camera-input" accept=".jpg,.jpeg,.png,image/jpeg,image/png" capture="environment" hidden>
      </div>
    </div>
  </div>

  <div class="dropzone" id="dropzone" hidden>
    <div class="dropzone__panel">
      <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V4.5M7.5 9 12 4.5 16.5 9"/><path d="M4.5 14.5v4a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-4"/></svg>
      <p class="dropzone__title">Drop your plant photo</p>
      <p class="dropzone__hint">JPG or PNG, up to 10 MB</p>
    </div>
  </div>

  <dialog class="sheet" id="phone-dialog" aria-labelledby="phone-title">
    <div class="sheet__inner">
      <div class="sheet__head">
        <h2 class="sheet__title" id="phone-title">Open FloraBOT on your phone</h2>
        <button type="button" class="btn btn-ghost btn-icon" id="phone-close" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet__body" id="phone-body"></div>
    </div>
  </dialog>

  <dialog class="sheet" id="models-dialog" aria-labelledby="models-title">
    <div class="sheet__inner">
      <div class="sheet__head">
        <h2 class="sheet__title" id="models-title">AI models</h2>
        <button type="button" class="btn btn-ghost btn-icon" id="models-close" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet__body">
        <p class="sheet__lead">Choose which Gemini model FloraBOT uses. Your choice is saved in this browser.</p>
        <label class="model-field">
          <span class="model-field__label">Watering and questions</span>
          <select class="model-field__select" id="model-select"></select>
          <span class="model-field__hint" id="model-hint"></span>
        </label>
        <label class="model-field">
          <span class="model-field__label">Plant health review</span>
          <select class="model-field__select" id="review-model-select"></select>
          <span class="model-field__hint" id="review-model-hint"></span>
        </label>
      </div>
    </div>
  </dialog>
</body>
</html>
